name: Android CI & Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Test SoualJawab APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle 9.3.1 & Dependency Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          gradle-home-cache-cleanup: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Setup Environment Files
        run: |
          if [ ! -f .env.example ]; then
            echo "# No secrets required" > .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Setup Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "debug.keystore not found. Restoring or generating..."
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored from debug.keystore.base64."
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated new debug.keystore."
            fi
          else
            echo "debug.keystore already exists."
          fi

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare Direct APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/SoualJawab-v1.5.0.apk
          echo "Copied APK to release-assets/SoualJawab-v1.5.0.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SoualJawab-v1.5.0-apk
          path: release-assets/SoualJawab-v1.5.0.apk
          retention-days: 14

      - name: Publish GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}
          name: سؤال جواب v1.5.0
          body: |
            لعبة سوأل جواب هو لعبة متعددة الاعبين بشكل محلي و امن
          draft: false
          prerelease: false
          files: |
            release-assets/SoualJawab-v1.5.0.apk
